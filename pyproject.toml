[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-engine"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["rdflib==7.1.4", "pydantic==2.10.6", "openpyxl==3.1.5", "defusedxml==0.7.1", "pyshacl==0.30.1", "owlrl==7.1.4", "Pint==0.24.4"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
browser = ["playwright==1.51.0", "pyee==12.1.1", "greenlet==3.2.5"]

[tool.setuptools.packages.find]
include = ["ontology_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ontology_engine = ["resources/*.ttl", "resources/*.txt", "resources/*.json", "web_demo/*/*", "web_assets/*"]
